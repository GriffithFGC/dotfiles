# Each target: input template -> output file. Optional `reload` is an argv list
# that runs once after ALL targets were written successfully.

[kitty]
input  = "~/.config/43pr/templates/kitty.conf"
output = "~/.config/kitty/matugen.conf"
reload = ["pkill", "-USR1", "-x", "kitty"]

[rofi]
input  = "~/.config/43pr/templates/rofi-colors.rasi"
output = "~/.config/rofi/colors.rasi"

[hyprlock]
input  = "~/.config/43pr/templates/hyprlock-colors.conf"
output = "~/.config/hypr/hyprlock-colors.conf"

[gtk3]
input  = "~/.config/43pr/templates/gtk-colors.css"
output = "~/.config/gtk-3.0/colors.css"

[gtk4]
input  = "~/.config/43pr/templates/gtk-colors.css"
output = "~/.config/gtk-4.0/colors.css"

[quickshell]
input  = "~/.config/43pr/templates/quickshell-theme.json"
output = "~/.cache/43pr/quickshell-theme.json"

[openrgb]
input  = "~/.config/43pr/templates/openrgb-color.txt"
output = "~/.cache/43pr/openrgb-color"
# Redirect so theme.py (which captures output) doesn't wait out the LED fade.
reload = ["sh", "-c", "setsid -f /home/femto/.local/bin/43pr-rgb-sync >/dev/null 2>&1 </dev/null"]

[btop]
input  = "~/.config/43pr/templates/btop.theme"
output = "~/.config/btop/themes/43pr.theme"
reload = ["pkill", "-USR2", "-x", "btop"]

[cava]
input  = "~/.config/43pr/templates/cava-theme"
output = "~/.config/cava/themes/43pr"
reload = ["pkill", "-USR2", "-f", "-x", "cava"]

[hypr]
input  = "~/.config/43pr/templates/hypr-colors.lua"
output = "~/.config/hypr/colors.lua"
reload = ["hyprctl", "reload"]


[spicetify]
input  = "~/.config/43pr/templates/spicetify-colors.ini"
output = "~/.cache/43pr/spicetify-colors.ini"
reload = ["/home/femto/.local/bin/43pr-spicetify-sync"]

# Vesktop watches its themes folder and reloads the CSS live: no reload hook needed.
[discord]
input  = "~/.config/43pr/templates/discord.theme.css"
output = "~/.config/vesktop/themes/43pr.theme.css"

# Material-Theme (Millennium) with Color = Matugen re-reads this file every 1.5s: no reload hook needed.
[steam]
input  = "~/.config/43pr/templates/steam-material.css"
output = "~/.local/share/Steam/millennium/themes/Material-Theme/css/main/colors/matugen.css"

# Zen reads userChrome/userContent only at startup; the hook copies them into the default profile.
[zen-chrome]
input  = "~/.config/43pr/templates/zen-userChrome.css"
output = "~/.cache/43pr/zen-userChrome.css"
reload = ["/home/femto/.local/bin/43pr-zen-sync"]

[zen-content]
input  = "~/.config/43pr/templates/zen-userContent.css"
output = "~/.cache/43pr/zen-userContent.css"
reload = ["/home/femto/.local/bin/43pr-zen-sync"]

# Folder icons: Papirus-43pr (inherits Papirus-Dark) rebuilt with the palette; GTK apps pick it up live.
[icons]
input  = "~/.config/43pr/templates/icons-colors.txt"
output = "~/.cache/43pr/icons-colors"
reload = ["/home/femto/.local/bin/43pr-icons-sync"]

# Obsidian watches <vault>/.obsidian/snippets: the hook copies the snippet into every vault and it reloads live.
[obsidian]
input  = "~/.config/43pr/templates/obsidian.css"
output = "~/.cache/43pr/obsidian.css"
reload = ["/home/femto/.local/bin/43pr-obsidian-sync"]

# OBS loads user themes from its config dir; the variant extends Yami and only recolors it.
# With AutoReload=true under [Appearance] in obs-studio/user.ini, OBS reloads it live.
[obs]
input  = "~/.config/43pr/templates/obs-43pr.ovt"
output = "~/.config/obs-studio/themes/43PR.ovt"
