// 43PR live theme for Zen (autoconfig; the first line must stay a comment).
// Loads <profile>/chrome/43pr-chrome.css and 43pr-content.css as user sheets and
// reloads them whenever 43pr-zen-sync rewrites them, so wallpaper changes recolor
// a running Zen. Installed into /opt/zen-browser-bin by 43pr-zen-autoconfig-install.
try {
  const { NetUtil } = ChromeUtils.importESModule("resource://gre/modules/NetUtil.sys.mjs");
  const sss = Cc["@mozilla.org/content/style-sheet-service;1"].getService(Ci.nsIStyleSheetService);
  const chromeDir = Services.dirsvc.get("UChrm", Ci.nsIFile);
  const sheets = ["43pr-chrome.css", "43pr-content.css"].map(name => ({ name, stamp: null, uri: null }));

  const read = file => {
    const s = Cc["@mozilla.org/network/file-input-stream;1"].createInstance(Ci.nsIFileInputStream);
    s.init(file, -1, 0, 0);
    try {
      return NetUtil.readInputStreamToString(s, s.available(), { charset: "UTF-8" });
    } finally {
      s.close();
    }
  };

  // A data: URI per version, so the sheet cache never serves the old colors back.
  const refresh = () => {
    for (const sheet of sheets) {
      try {
        const file = chromeDir.clone();
        file.append(sheet.name);
        const stamp = file.exists() ? `${file.lastModifiedTime}:${file.fileSize}` : null;
        if (stamp === sheet.stamp) continue;
        if (sheet.uri && sss.sheetRegistered(sheet.uri, sss.USER_SHEET)) {
          sss.unregisterSheet(sheet.uri, sss.USER_SHEET);
        }
        sheet.uri = stamp
          ? Services.io.newURI("data:text/css;charset=utf-8," + encodeURIComponent(read(file)))
          : null;
        if (sheet.uri) sss.loadAndRegisterSheet(sheet.uri, sss.USER_SHEET);
        sheet.stamp = stamp;
      } catch (e) {
        console.error("43pr.cfg:", sheet.name, e);
      }
    }
  };

  refresh();
  // Kept on Services so the timer outlives this script's scope.
  Services.zen43prTimer = Cc["@mozilla.org/timer;1"].createInstance(Ci.nsITimer);
  Services.zen43prTimer.initWithCallback({ notify: refresh }, 1500, Ci.nsITimer.TYPE_REPEATING_SLACK);
} catch (e) {
  Cu.reportError("43pr.cfg: " + e);
}
